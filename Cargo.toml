[package]
name = "appsettingstoenv"
version = "0.0.1"
edition = "2024"
description = "Convert appsettings.json to environment variables (KEY=value) for Docker"
license = "MIT"

[dependencies]
arboard = "3.6.1"
rfd = "0.17.2"
serde_json = "1.0.151"
slint = "1.17.1"

[build-dependencies]
slint-build = "1.17.1"

[package.metadata.deb]
maintainer = "Rafael Queiroz Santos <rafaelqsantos33@gmail.com>"
copyright = "2026, Rafael Queiroz Santos <rafaelqsantos33@gmail.com>"
extended-description-file = "packaging/description.txt"
section = "utils"
priority = "optional"
depends = "$auto, libx11-6, libxkbcommon0, libwayland-client0, libgl1"
assets = [
    ["target/release/appsettingstoenv", "usr/bin/", "755"],
    ["packaging/appsettingstoenv.desktop", "usr/share/applications/", "644"],
    ["packaging/appsettingstoenv.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["packaging/appsettingstoenv.metainfo.xml", "usr/share/metainfo/", "644"],
]
