name: Release

on:
  push:
    tags: ['v*.*.*']

jobs:
  release:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Install system dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo rm -f /etc/apt/apt-mirrors.txt
          cat << 'EOF' | sudo tee /etc/apt/sources.list
          deb http://us.archive.ubuntu.com/ubuntu jammy main restricted universe multiverse
          deb http://us.archive.ubuntu.com/ubuntu jammy-updates main restricted universe multiverse
          deb http://security.ubuntu.com/ubuntu jammy-security main restricted universe multiverse
          EOF
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libxkbcommon-dev libwayland-dev libx11-dev libgl1-mesa-dev libfontconfig1-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Install cargo-deb
        uses: taiki-e/install-action@cargo-deb

      - name: Build .deb package
        run: cargo deb

      - name: Setup appimagetool
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get install -y libfuse2
          sudo wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -O /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool

      - name: Install cargo-appimage
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-appimage

      - name: Build AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: cargo appimage

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            target/debian/*.deb
            target/appimage/*.AppImage
          generate_release_notes: true
